[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-postgres"
version = "0.1.0"
description = "PostgreSQL state-store adapter for domain-agent-framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["domain-agent-core>=0.1.0,<0.2.0", "sqlalchemy>=2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
