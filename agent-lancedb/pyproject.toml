[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-lancedb"
version = "0.2.0"
description = "LanceDB semantic-memory adapter for the generic domain-agent runtime"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "domain-agent-framework" }]
dependencies = [
    "domain-agent-core>=0.2.0,<0.3.0",
    "lancedb>=0.15.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
