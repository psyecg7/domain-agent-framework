name: Conformance

on:
  push:
  pull_request:

jobs:
  conformance:
    name: Conformance checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install conformance reference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e . -e ./agent-conformance -e ./agent-delta
      - name: Run conformance helpers and adopted reference checks
        run: |
          python -m pytest -q agent-conformance/tests tests/test_conformance_delta_evidence.py
