name: Release compatibility

on:
  push:
  pull_request:

jobs:
  clean-install:
    name: Clean wheel install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build distributable wheels
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --wheel-dir dist \
            . ./agent-app ./conformance ./storage-delta ./enterprise \
            ./memory-lancedb ./model-ollama ./model-openai ./storage-postgres \
            ./transport-redpanda ./scheduler
      - name: Install wheels in a clean environment
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --upgrade pip
          .release-venv/bin/python -m pip install --find-links dist dist/*.whl
      - name: Smoke-import every distributable package
        run: |
          .release-venv/bin/python -c 'import agent_core, agent_app, conformance, storage_delta, enterprise, memory_lancedb, model_ollama, model_openai, storage_postgres, transport_redpanda, scheduler'

  unit-and-conformance:
    name: Unit and conformance (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies and local packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e . -e ./agent-app -e ./conformance \
            -e ./storage-delta -e ./enterprise -e ./memory-lancedb \
            -e ./model-ollama -e ./model-openai -e ./storage-postgres \
            -e ./transport-redpanda -e ./scheduler \
            -e './examples/kad-inventory[test]'
      - name: Run deterministic unit and conformance tests
        run: python -m pytest -q
