name: Publish to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.project }} distributions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: .
            project: agent-core
          - directory: agent-app
            project: agent-app
          - directory: conformance
            project: conformance
          - directory: storage-delta
            project: storage-delta
          - directory: enterprise
            project: enterprise
          - directory: memory-lancedb
            project: memory-lancedb
          - directory: model-ollama
            project: model-ollama
          - directory: model-openai
            project: model-openai
          - directory: storage-postgres
            project: storage-postgres
          - directory: transport-redpanda
            project: transport-redpanda
          - directory: scheduler
            project: scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build ${{ matrix.directory }} --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.project }} to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/${{ matrix.project }}/
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        project:
          - agent-core
          - agent-app
          - conformance
          - storage-delta
          - enterprise
          - memory-lancedb
          - model-ollama
          - model-openai
          - storage-postgres
          - transport-redpanda
          - scheduler
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.project }}-dist
          path: dist
      - name: Publish distribution to TestPyPI through OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
