[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-enterprise"
version = "0.1.0"
description = "Optional cross-service authorization reference for domain-agent-framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "agent-delta>=0.1.0,<0.2.0",
    "agent-postgres>=0.1.0,<0.2.0",
    "domain-agent-core>=0.1.0,<0.2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
