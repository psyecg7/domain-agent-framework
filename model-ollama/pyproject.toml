[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-ollama"
version = "0.3.0"
description = "Ollama model integration for agent-core reasoning and intents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "domain-agent-framework" }]
dependencies = [
    "agent-core>=0.3.0,<0.4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
