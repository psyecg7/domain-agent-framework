[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storage-delta"
version = "0.3.0"
description = "Delta-backed durable storage for agent-core"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "domain-agent-framework" }]
dependencies = [
    "deltalake>=0.17.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "agent-core>=0.3.0,<0.4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
