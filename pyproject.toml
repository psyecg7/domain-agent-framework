[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-core"
version = "0.3.0"
description = "Technology-independent core runtime for generic domain agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "domain-agent-framework" }]
license = "MIT"
dependencies = []

[project.optional-dependencies]
validation = ["jsonschema>=4.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_core*"]

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "storage-delta/src",
    "enterprise/src",
    "memory-lancedb/src",
    "model-ollama/src",
    "transport-redpanda/src",
    "scheduler/src",
    "model-openai/src",
    "storage-postgres/src",
    "agent-app/src",
    "conformance/src",
]
markers = [
    "integration: requires an externally running broker or other infrastructure",
]
