[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-redpanda"
version = "0.2.0"
description = "Redpanda event adapter for the generic domain-agent runtime"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "domain-agent-framework" }]
dependencies = [
    "confluent-kafka>=2.3.0",
    "domain-agent-core>=0.2.0,<0.3.0",
]

[project.optional-dependencies]
tracing = ["opentelemetry-api>=1.20"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
