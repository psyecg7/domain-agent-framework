[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-scheduler"
version = "0.1.0"
description = "In-process delayed-event adapter for domain-agent-framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["domain-agent-core>=0.1.0,<0.2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
