[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise"
version = "0.3.0"
description = "Optional cross-service authorization reference for domain-agent-framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "storage-delta>=0.3.0,<0.4.0",
    "storage-postgres>=0.3.0,<0.4.0",
    "agent-core>=0.3.0,<0.4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
