[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transport-redpanda"
version = "0.3.0"
description = "Redpanda event transport for agent-core applications"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "domain-agent-framework" }]
dependencies = [
    "confluent-kafka>=2.3.0",
    "agent-core>=0.3.0,<0.4.0",
]

[project.optional-dependencies]
tracing = ["opentelemetry-api>=1.20"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
