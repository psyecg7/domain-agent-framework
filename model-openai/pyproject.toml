[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-openai"
version = "0.3.0"
description = "OpenAI model integration for agent-core reasoning and intents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["agent-core>=0.3.0,<0.4.0", "openai>=1.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
