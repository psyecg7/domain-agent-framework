[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-agent-app"
version = "0.2.0"
description = "Simple local application layer for domain-agent-core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["domain-agent-core>=0.2.0,<0.3.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
